<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>علامة تبويب جديدة</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: radial-gradient(circle at 50% 30%, #23263a, #16171b 70%);
      color: #e8eaf0; font-family: system-ui, "Noto Sans Arabic", sans-serif;
    }
    h1 { margin: 0; font-size: 30px; font-weight: 600;
      background: linear-gradient(135deg, #6aa8ff, #7c5cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    form { width: 86vw; max-width: 520px; }
    input { width: 100%; box-sizing: border-box; height: 48px; padding: 0 22px; border-radius: 24px; font-size: 16px;
      border: 1px solid #323644; background: #1e2026; color: #e8eaf0; outline: none; }
    input:focus { border-color: #6aa8ff; }
    p { margin: 0; color: #9097a8; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Qwen Browser</h1>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" placeholder="ابحث في DuckDuckGo" autocomplete="off" />
  </form>
  <p>اضغط ✦ لفتح المساعد</p>
</body>
</html>
